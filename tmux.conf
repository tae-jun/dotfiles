# ~/.tmux.conf — managed by ~/dotfiles (setup-shell.sh)

# ---------- 터미널 ----------
# tmux 안에서는 tmux-256color. 바깥 터미널(Ghostty 등)의 트루컬러는 그대로 전달
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -sg escape-time 10                        # ESC 입력 지연 제거 (기본 500ms 면 claude·vim 에서 ESC/Alt 가 굼뜸)
set -s extended-keys on                       # Shift+Enter 같은 확장 키를 앱에 전달 (claude 줄바꿈)
set -as terminal-features ",xterm-ghostty:extkeys,xterm-256color:extkeys"
set -s set-clipboard on                       # 복사하면 SSH 너머 로컬 클립보드로 (OSC 52)
set -g focus-events on

# ---------- 편의 ----------
set -g mouse on                               # 스크롤, 패인 클릭·크기 조절
set -g history-limit 100000
set -g base-index 1                           # 창·패인 번호 1부터
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on
set -g display-time 2000

# 새 창·분할은 현재 디렉토리에서
bind c new-window      -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "reloaded"
